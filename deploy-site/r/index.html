<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading resume…</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Arial,sans-serif;background:#f1f1f4;color:#1e293b;}
  .msg{text-align:center;padding:24px;}
  .spinner{width:44px;height:44px;border:3px solid #e2e8f0;border-top-color:#d97706;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 18px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  h2{font-size:1.15rem;font-weight:700;margin:0 0 8px;}
  p{font-size:0.88rem;color:#64748b;line-height:1.6;}
  a{color:#d97706;text-decoration:none;}
  a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="msg" id="msg">
  <div class="spinner"></div>
  <h2>Loading resume…</h2>
  <p>Please wait a moment.</p>
</div>
<script>
(function() {
  var parts = window.location.pathname.split('/').filter(function(s){ return s.length > 0; });
  var slug = parts[parts.length - 1] || '';
  if (!slug || slug === 'r') {
    document.getElementById('msg').innerHTML =
      '<h2>Resume not found</h2><p>No resume ID in the URL.<br>Visit <a href="https://resume4u.help">resume4u.help</a> to create one.</p>';
    return;
  }
  function showNotFound() {
    document.getElementById('msg').innerHTML =
      '<h2>Resume not found</h2>'
      + '<p>This link may have expired or the resume does not exist.<br>'
      + 'Please <a href="https://resume4u.help">generate a new share link</a>.</p>';
  }
  function showExpired() {
    document.getElementById('msg').innerHTML =
      '<h2>This resume link has expired</h2>'
      + '<p>Shared resume links stay active for 30 days.<br>'
      + 'Ask for an updated link, or create your own free at <a href="https://resume4u.help">resume4u.help</a>.</p>';
  }
  // Safe, never-cut fit applied by THIS viewer (served fresh every scan) so every
  // shared resume renders correctly — including ones published before the fix, with
  // no need to re-publish. We strip whatever fit script the stored page baked in and
  // inject one authoritative version: size from the TRUE visible width, never scale
  // above 100% (A4 fits any desktop/tablet), centre, and shrink further if anything
  // would spill past the screen. Guarantees no side-cut on any device.
  // Fit the A4 page to the phone's width — but measured from the LAYOUT viewport only
  // (clientWidth), never the visual viewport: pinch-zoom changes the visual viewport,
  // and re-fitting on it shrank the page while the user was zooming in (jerky zoom).
  // Re-fit only when the real width changes (rotation), never while zoomed in.
  // Phones also get a "Zoom in / Fit to screen" button: actual size (100%) with
  // sideways scrolling, so the text is readable without pinching.
  var SAFEFIT = '(function(){var f=document.getElementById("r4uFit"),o=document.getElementById("r4uOuter");if(!f)return;var n=794,full=false,lastW=0;'
    + 'try{var mv=document.querySelector("meta[name=viewport]");if(!mv){mv=document.createElement("meta");mv.name="viewport";document.head.appendChild(mv);}mv.content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes";}catch(e){}'
    + 'function W(){return document.documentElement.clientWidth||window.innerWidth||n;}'
    + 'function zoomed(){return !!(window.visualViewport&&window.visualViewport.scale>1.02);}'
    + 'function mr(){var p=document.querySelector(".resume-a4-page");if(!p)return 0;var e=p.getElementsByTagName("*"),m=0;for(var i=0;i<e.length;i++){var r=e[i].getBoundingClientRect();if(r.right>m)m=r.right;}return m;}'
    + 'function set(s){f.style.transformOrigin="top left";f.style.transform=(s===1)?"none":"scale("+s+")";f.style.marginBottom=(s===1?0:Math.round(f.offsetHeight*(s-1)))+"px";}'
    + 'function d(force){if(!force&&zoomed())return;var vw=W();lastW=vw;'
    + 'if(full||vw>=n){f.style.marginLeft=(vw>n?Math.round((vw-n)/2):12)+"px";set(1);if(o)o.style.overflowX=(vw>=n?"hidden":"auto");btn();return;}'
    + 'if(o)o.style.overflowX="hidden";var s=vw/(n+24);f.style.marginLeft="0px";set(s);'
    + 'var g=0;while(g++<18&&mr()>vw-2&&s>0.2){s*=0.95;set(s);}'
    + 'f.style.marginLeft=Math.max(0,(vw-n*s)/2)+"px";btn();}'
    + 'var b=null;function btn(){var need=W()<n;if(!b&&need){b=document.createElement("button");b.type="button";b.id="r4uZoomBtn";b.onclick=function(){full=!full;d(true);try{window.scrollTo(0,window.scrollY);}catch(e){}};document.body.appendChild(b);}'
    + 'if(b){b.style.display=need?"flex":"none";b.innerHTML=full?"<span>⤡</span> Fit to screen":"<span>⤢</span> Zoom in";b.setAttribute("aria-pressed",full?"true":"false");}}'
    + 'function rs(){if(W()!==lastW)d();}'
    + 'window.addEventListener("resize",rs);window.addEventListener("orientationchange",function(){setTimeout(function(){d(true);},250);});window.addEventListener("load",function(){d(true);});'
    + 'if(document.readyState!=="loading")d(true);else window.addEventListener("DOMContentLoaded",function(){d(true);});'
    + 'if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){d();});'
    + 'setTimeout(d,120);setTimeout(d,400);setTimeout(d,1000);})();';
  var SAFECSS = '<style>html,body{overflow-x:visible!important;touch-action:manipulation;}#r4uOuter{overflow-x:hidden;padding:28px 0 84px!important;-webkit-overflow-scrolling:touch;}'
    + '#r4uFit{will-change:auto!important;}'
    + '#r4uZoomBtn{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:none;align-items:center;gap:7px;border:0;border-radius:99px;padding:11px 18px;'
    + 'font:600 15px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#431407;background:linear-gradient(135deg,#fcd34d,#fbbf24 45%,#f59e0b);box-shadow:0 10px 24px -10px rgba(120,53,15,.6);cursor:pointer;-webkit-tap-highlight-color:transparent;}'
    + '#r4uZoomBtn span{font-size:17px;}@media print{#r4uZoomBtn{display:none!important;}}</style>';
  function applySafeFit(html) {
    try {
      // Remove the page's own fit <script> (identified by the #r4uFit id) so it
      // can't fight ours. The standalone page has exactly one script block.
      html = html.replace(/<script\b[^>]*>(?:(?!<\/script>)[\s\S])*?r4uFit(?:(?!<\/script>)[\s\S])*?<\/script>/gi, '');
      var inject = SAFECSS + '<script>' + SAFEFIT + '<\/script>';
      if (html.indexOf('</body>') > -1) html = html.replace('</body>', inject + '</body>');
      else html = html + inject;
    } catch (e) {}
    return html;
  }
  function renderHtml(html) {
    document.open('text/html', 'replace');
    document.write(applySafeFit(html));
    document.close();
  }
  // Resume pages are stored in the same Firestore collection as portfolios (an
  // html document), read directly in the browser (the correct Referer lets a
  // restricted API key work). No Netlify function is used, so no portfolio-only
  // analytics or testimonial injection runs against a resume doc.
  var fsUrl = 'https://firestore.googleapis.com/v1/projects/resume-ai-2eda1/databases/(default)/documents/portfolios/'
    + encodeURIComponent(slug)
    + '?key=AIzaSyDUgpJQ8PbQgwqj1EUAe9Va4iG8BnNQm10';
  // cache:'no-store' so a fresh scan always pulls the latest published resume.
  // (Do NOT append extra query params — Firestore's REST API rejects unknown
  // parameters with a 400, which would break the fetch.)
  fetch(fsUrl, { cache: 'no-store' })
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(doc) {
      if (!doc || !doc.fields) { showNotFound(); return; }
      // Enforce the 30-day validity window recorded at publish time.
      var exp = doc.fields.expiresAt && doc.fields.expiresAt.timestampValue;
      if (exp) { var t = Date.parse(exp); if (!isNaN(t) && Date.now() > t) { showExpired(); return; } }
      var html = doc.fields.html && doc.fields.html.stringValue;
      if (html) { renderHtml(html); } else { showNotFound(); }
    })
    .catch(showNotFound);
})();
</script>
</body>
</html>
