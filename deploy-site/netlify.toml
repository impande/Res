# v2
# Netlify builds with this directory (deploy-site) as the base, and publishes it.
# The canonical app lives in the repo-root index.html. To guarantee the two
# never drift again, the build step copies the root index.html into this
# publish directory at deploy time. `|| true` keeps the deploy succeeding even
# if the copy is ever a no-op, in which case the committed copy below is served.
[build]
  command   = "npm install && cp ../index.html index.html || true"
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."generate"]
  timeout = 26

[functions."share-portfolio"]
  timeout = 15

# Free career tools: poll endpoint + fast synchronous fallback. The heavy work
# runs in career-tools-background (Netlify background function, no 26s cap).
[functions."career-tools"]
  timeout = 26

# Daily WhatsApp job alerts at 09:00 IST (03:30 UTC). Scheduled functions only
# fire on the PUBLISHED (production) deploy; on UAT use the manual trigger:
#   /.netlify/functions/job-alerts?key=<WHATSAPP_VERIFY_TOKEN>&to=<number>
[functions."job-alerts"]
  schedule = "30 3 * * *"

# SEO landing pages — serve homepage content at keyword-rich URLs (200 = proxy, not redirect)
