# Tell Netlify to build and publish from the deploy-site/ subdirectory.
# Without this file at the repo root, Netlify defaults to the repo root
# and misses sitemap.xml, og-image.png, functions, examples/, etc.
[build]
  command   = "npm install && node build.js"
  publish   = "deploy-site"
  functions = "deploy-site/netlify/functions"

[functions]
  node_bundler = "nft"

[functions."generate"]
  timeout = 26

[functions."share-portfolio"]
  timeout = 15

# WhatsApp bot: AI replies (mock-interview feedback, resume import) need more than 10s.
[functions."whatsapp"]
  timeout = 26

# Free career tools: fast synchronous fallback (main path is career-tools-background).
[functions."career-tools"]
  timeout = 26

# Daily WhatsApp job alerts at 09:00 IST (03:30 UTC). Scheduled functions only run on
# the published production deploy; on UAT trigger it manually:
#   /.netlify/functions/job-alerts?key=<WHATSAPP_VERIFY_TOKEN>&to=<number>
[functions."job-alerts"]
  schedule = "30 3 * * *"

[[redirects]]
  from = "/p/*"
  to = "/p/index.html"
  status = 200

[[redirects]]
  from = "/r/*"
  to = "/r/index.html"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[redirects]]
  from = "/__/auth/*"
  to = "https://resume-ai-2eda1.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true
